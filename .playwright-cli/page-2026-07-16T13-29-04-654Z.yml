              - heading "脚本原文" [level=2] [ref=f1e2112]
            - code [ref=f1e2117]: "<!doctype html> <html lang=\"zh-CN\"> <head> <meta charset=\"utf-8\"> <title>Claude Code Workflow，可能是下一个 MCP 时刻</title> </head> <body> <section style=\"margin:0 auto;max-width:680px;padding:16px 0;color:#1f2937;font-size:16px;line-height:1.9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;\"> <h1 style=\"margin:0 0 18px;font-size:24px;line-height:1.35;color:#111827;font-weight:800;\"> Claude Code Workflow，可能是下一个 MCP 时刻 </h1> <p style=\"margin:0 0 18px;color:#4b5563;\"> Claude Code 刚出了一个功能，叫 Workflow。 </p> <p style=\"margin:0 0 18px;\"> 我用它跑了一次 deep-research，25 分钟，104 个 agent，280 万 token。 </p> <p style=\"margin:0 0 22px;\"> 跑完我只有一个感觉，这项技术可能会成为 Anthropic 继 MCP、Skill 之后的又一个关键创新。 </p> <p style=\"margin:20px 0;text-align:center;\"> <img src=\"5.30 claudecode workflow v4__assets/wechat-cover.jpg\" alt=\"Claude Code Workflow 封面\" style=\"display:block;width:100%;height:auto;border-radius:8px;\"> </p> <section style=\"margin:26px 0;padding:18px 18px 16px;border-left:4px solid #ff7a1a;background:#fff7ed;border-radius:8px;\"> <p style=\"margin:0;color:#7c2d12;font-size:18px;font-weight:800;line-height:1.65;\"> 它让 Claude Code 从「自己写代码」，变成「组织一群 agent 干活」。 </p> <p style=\"margin:10px 0 0;color:#9a3412;\"> 这不是多开几个窗口那么简单，而是把复杂任务变成可审计、可复用、可版本控制的执行系统。 </p> </section> <p style=\"margin:0 0 18px;\"> 提到工作流，大家肯定会想到 Dify、Coze。 </p> <p style=\"margin:0 0 18px;\"> 但 Claude Code 这里的 Workflow，不太一样。 </p> <p style=\"margin:0 0 18px;\"> 它不是让你在画布上拖几个节点，而是你描述一个任务，Claude Code 会生成一个 JS 编排脚本，把任务拆成阶段，把不同阶段分给不同 agent，然后在后台协调几十到上百个 subagent，最后收敛成一个结果。 </p> <p style=\"margin:0 0 22px;\"> 这个变化挺关键的。 </p> <section style=\"margin:22px 0;padding:18px;background:#111827;color:#f9fafb;border-radius:10px;\"> <p style=\"margin:0;font-size:18px;line-height:1.7;font-weight:800;\"> Prompt 不再是终点。<br> Workflow 本身开始变成资产。 </p> </section> <p style=\"margin:0 0 18px;\"> 以前所谓的 agent team，很多时候还是临时拼出来的。 </p> <p style=\"margin:0 0 18px;\"> 你这次让它这么分工，下次它可能换一种分工。你这次让它查资料，下次它可能少验证一步。整个过程很依赖模型临场发挥。 </p> <p style=\"margin:0 0 22px;\"> Workflow 把这件事往前推了一步，它把临时协作固化成代码，让你能看到它分了哪些阶段，开了多少 agent，预算怎么花，最后怎么收敛。 </p> <p style=\"margin:22px 0;text-align:center;\"> <img src=\"5.30 claudecode workflow v4__assets/wechat-workflow-overview.jpg\" alt=\"Claude Code Workflow 工作方式示意图\" style=\"display:block;width:100%;height:auto;border-radius:8px;\"> </p> <p style=\"margin:0 0 18px;\"> 拿官方内置的 deep-research workflow 举例，它大概是五段式。 </p> <p style=\"margin:0 0 14px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 1、Scope，把你的问题拆成 5 个不同角度的搜索词，避免后面只沿着一个方向挖。 </p> <p style=\"margin:0 0 14px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 2、Search，5 个 agent 并发搜索，每个角度各找 4 到 6 条结果，互不等待。 </p> <p style=\"margin:0 0 14px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 3、Fetch + Extract，去重后抓取最多 15 个网页，每个页面提取 2 到 5 条可证伪的具体结论。 </p> <p style=\"margin:0 0 14px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 4、Verify，每条结论再派 3 个持怀疑态度的 agent 独立找反证，2 票反对就淘汰。 </p> <p style=\"margin:0 0 22px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 5、Synthesize，把通过验证的结论合并，按置信度排序，写成带来源引用的最终报告。 </p> <p style=\"margin:22px 0;text-align:center;\"> <img src=\"5.30 claudecode workflow v4__assets/wechat-deep-research-pipeline.jpg\" alt=\"deep-research workflow 五阶段拆解图\" style=\"display:block;width:100%;height:auto;border-radius:8px;\"> </p> <p style=\"margin:0 0 18px;\"> 我这次就是用 deep-research 去调研 Claude Code 最新的 Workflow 功能，然后让它写一篇文章。 </p> <p style=\"margin:0 0 18px;\"> 它启动了完整流程，最后一共花了 25 分钟，动用了 104 个 agent，消耗 280 万 token，验证了 25 条声明。 </p> <p style=\"margin:0 0 18px;\"> 最后输出的东西，完成度确实不错。 </p> <p style=\"margin:0 0 22px;\"> 它不只是把网上内容拼一遍，而是把 Workflow 的核心定位、和 Agent Teams 的区别、运行时限制、内置 deep-research 的阶段拆解，都整理得比较清楚。 </p> <section style=\"margin:26px 0;padding:18px;border:1px solid #dbeafe;background:#eff6ff;border-radius:10px;\"> <p style=\"margin:0 0 10px;color:#1e3a8a;font-weight:800;\">这次实测数据</p> <p style=\"margin:0 0 8px;font-size:24px;line-height:1.35;color:#111827;font-weight:800;\"> 25 分钟 · 104 个 agent · 280 万 token </p> <p style=\"margin:0;color:#1d4ed8;\"> 很爽，但也很贵。所以预算控制会变得非常重要。 </p> </section> <p style=\"margin:0 0 18px;\"> 这时候肯定有人要问，这么玩，token 是不是要爆炸。 </p> <p style=\"margin:0 0 18px;\"> 坦率的讲，会。 </p> <p style=\"margin:0 0 18px;\"> 多 agent 听起来很爽，但没有预算控制，它就是 token 粉碎机。 </p> <p style=\"margin:0 0 18px;\"> 所以 Workflow 里有一个很关键的设计，就是可以直接在任务里写预算，比如 <code style=\"padding:2px 5px;background:#f3f4f6;border-radius:4px;color:#111827;\">workflow 100k</code>。 </p> <p style=\"margin:0 0 22px;\"> Claude Code 会根据这个预算，规划 agent 数量、每个阶段的深度，以及最后怎么收敛。 </p> <p style=\"margin:0 0 18px;\"> 怎么用呢，其实就两种方式。 </p> <p style=\"margin:0 0 14px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 第一种，在提示词里直接提到 <code style=\"padding:2px 5px;background:#eef2ff;border-radius:4px;color:#3730a3;\">workflow</code> 这个词。 </p> <p style=\"margin:0 0 14px;padding:12px 14px;background:#f9fafb;border-radius:8px;\"> 第二种，使用 <code style=\"padding:2px 5px;background:#eef2ff;border-radius:4px;color:#3730a3;\">/effort ultracode</code> 开启。 </p> <p style=\"margin:0 0 22px;\"> 然后用 <code style=\"padding:2px 5px;background:#eef2ff;border-radius:4px;color:#3730a3;\">/workflows</code> 查看当前正在跑的工作流，包括每个阶段的执行情况和 agent 数量。 </p> <p style=\"margin:0 0 18px;\"> 回到 Claude Code Workflow 这件事。 </p> <p style=\"margin:0 0 18px;\"> 我觉得它不是一个普通的新功能。 </p> <p style=\"margin:0 0 18px;\"> 它更像是一个信号，AI 编程正在从个人能力，转向组织能力。 </p> <p style=\"margin:0 0 18px;\"> 以前我们问，一个模型能不能写代码。 </p> <p style=\"margin:0 0 18px;\"> 后来我们问，一个 agent 能不能独立完成任务。 </p> <p style=\"margin:0 0 22px;\"> 现在问题变了，一个系统能不能组织多个 agent，在预算内、可验证地完成复杂任务。 </p> <section style=\"margin:28px 0 22px;padding:20px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;\"> <p style=\"margin:0;color:#7c2d12;font-size:18px;line-height:1.75;font-weight:800;\"> 这可能才是 Workflow 真正有意思的地方。<br> 它不是让 AI 更会单兵作战，而是让 AI 开始学会组织协作。 </p> </section> <p style=\"margin:0 0 18px;\"> 大时代啊，朋友们。 </p> <p style=\"margin:0 0 18px;\"> 以上，如果觉得这篇对你有帮助，随手点个赞、在看、转发三连吧。 </p> <p style=\"margin:0 0 8px;\"> 我会继续把这些 AI 工具的一手体验和踩坑记录写出来。 </p> </section> </body> </html>"

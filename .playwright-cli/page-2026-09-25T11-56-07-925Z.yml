          - generic [ref=e568]: 生成图片：修长柔和的鹅蛋脸，舒展的深棕杏眼，平缓自然眉，鼻梁纤细，嘴唇轻合，素净淡妆。生成一张横向16:9的中式诗意电影肖像。 成像质感优先：这是一帧柔润、略理想化的中式美学AI电影影像，具有明显的表面肌理柔化，不是展示皮肤细节的高清摄影。脸部仍是真人五官和自然体积，但皮肤表面极平顺，像奶油金色的温润瓷光，只有宽大、连续、柔缓的光影塑形，没有任何毛孔、颗粒、雀斑、绒毛、细纹或砂纸肌理；眼睛、眉形和唇线可辨，其余皮肤不刻画细碎细节。白衣像光滑的柔润绸面，无布纹，无密集细褶；白花的瓣面平顺，只有几道柔和明暗，无植物纤维纹理。头发是整体暗色体块与宽柔金色光纹，不强调每根发丝。背景完全化开，大面积绿光渐变。强力降低微纹理对比，同时保留扎实黑位和清楚的大块明暗，不给画面蒙灰；高光边缘略有扩散软晕，呈现柔而凝练的中式电影意境。 画面是一位女子在深檐下安静执花的正面肩部以上肖像。相机保持足够距离，从完整发顶到双肩的中近景，必须看见整个圆润颅顶轮廓，发顶在画面高度3%左右，额头发际线约在高度25%，双眼约在高度46%，唇部约在高度66%，肩线只在最下方约15%区域出现。人脸中轴在横幅中央约51%处，脸宽约占横幅四分之一，头发连盘髻约占三分之一；人物左右均留出宽阔的绿色背景，不能将头放大裁掉。她头部端正、不歪头，面部近乎正对镜头，眼睑稍垂、目光沉静地看向镜头，唇自然轻合。深棕近黑的头发偏分后低低盘起，画面右侧耳后别一朵乳白花，两耳佩戴细长素白水滴坠。纯米白色光滑柔软的窄立领挂脖衣，露肩，领子简洁贴颈。画面左下的一只手握住短花梗，将一朵奶白色花举在嘴唇下方，花中心约在画面横向47%、纵向75%。花不是密集碎瓣的花球，而是两三层数量不多的宽阔、略尖、厚润花瓣，向左右舒展成浅碗，白花直径约脸宽一半；可以看见分明的大瓣轮廓，手指自然弯曲。 画面的神韵来自有方向的暖光、浓淡分明的绿金色和柔润低纹理。右上方的暖阳擦亮发顶及右侧盘发，在深黑发块上形成成片蜜金亮纹；右侧面颊有一块较宽的奶油金受光面，边缘柔软，鼻梁中部稍亮。眉弓下、眼窝、左脸和下颌是温润黄赭阴影，仍保留眼神与五官体积。整张脸的底色是暖米金中间调，有局部亮暗层次，不是全脸粉白，也不陷入全脸棕黑。颈侧与肩膀只有零散柔暖光片，不沿肩线连续描出耀眼白边。少量发丝和白花瓣最亮，亮部温和收住。 背景以有密度的中等亮度冷玉绿为主，大片柔和青绿色和翠绿色，明确偏绿而不是卡其黄、橄榄棕或灰褐色。画面左后方约占四成面积，呈宽广、平缓、连续的青瓷绿色光场，像远处明亮绿水映入窗内；右后方更深，偏墨青绿。绿色的中间调与脸颊中间调相近，左侧局部比脸稍亮；只有人物和花受光处温暖，背景仍清凉。画面最右约六分之一为扎实近黑竖向窗框，最左有一条黑框和一道很宽很模糊的浅绿竖向光带。背后所有景物都化成大块平顺的绿光渐变，横向大块颜色互相融化，看不到任何一片树叶、一根树枝、一块砖、一条屋檐、一格窗棂；没有斑驳树影、密集散景光斑或颗粒状绿色团块。保留绿黑背景与奶油金人物的清楚冷暖分离。 避免均匀正面美容光、粉白皮肤、全脸深暗、满肩硬白轮廓光、橙色滤镜、灰黄背景、锐利毛孔、HDR细节、密集菊花瓣、清晰园林建筑、花纹服装、多余手指与肢体、文字、标志和水印。

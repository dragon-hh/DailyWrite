      - paragraph [ref=f1e151]: 假设每张合约 100 股，金额用“元”演示；实际以合约规格为准。盈亏忽略费用、税费和利息。美式期权可能提前被要求买入（指派）；股价恰好等于行权价时也不能保证不被指派。未备足现金的卖 Put 还可能面临追保、强平。想提前退出，需买回同一合约，可能亏损。仅作入门教学，不构成投资建议。
